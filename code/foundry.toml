[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./results" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[lint]
lint_on_build = false

[fuzz]
runs = 1000
